<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>num-sim · 数值沙盘</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <span class="brand">num-sim<small>数值沙盘</small></span>
    <div class="grp">
      <button data-mode="select" title="V">选择</button>
      <button data-mode="link" title="L">连线</button>
      <button data-mode="delete" title="X">删除</button>
    </div>
    <div class="grp">
      <button data-mode="add:pool" title="状态：持有数值，可绑定 Luban 数据行"><span class="dot" style="background:#4f8cff"></span>资源池</button>
      <button data-mode="add:action" title="行为：何时（触发/条件/概率）做什么（消耗→产出）"><span class="dot sq" style="background:#f5c542"></span>行为</button>
      <button data-mode="add:formula" title="派生状态：只读的计算值"><span class="dot" style="background:#2ad4d4"></span>公式</button>
    </div>
    <div class="grp">
      <span class="dim">Tick</span><input id="ticks" type="number" min="1" max="100000" value="200" style="width:72px">
      <span class="dim" title="rand/randint/chance 与行为概率使用的随机种子，同一种子结果可复现">种子</span><input id="seed" type="number" value="1" style="width:56px">
      <button class="primary" id="btnRun" title="从 0 开始运行指定的 tick 数">运行</button>
      <button id="btnPlay" title="从当前状态开始持续运行，不设上限（空格键）">▶ 持续</button>
      <select id="speed" title="持续运行速度（tick/秒）"></select>
      <button id="btnStep">单步</button>
      <button id="btnReset">重置</button>
      <label class="chk" title="修改图后自动按上次的 tick 数重跑"><input type="checkbox" id="autoRerun" checked>改图自动重跑</label>
      <span id="tickInfo">tick 0</span>
    </div>
    <div class="grp">
      <button id="btnCsv">导出CSV</button>
      <button id="btnExport">导出JSON</button>
      <button id="btnImport">导入JSON</button>
      <input type="file" id="fileImport" accept=".json" hidden>
    </div>
    <div class="grp">
      <button id="btnFit">适应视图</button>
      <button id="btnExample">载入示例</button>
      <button id="btnClear" class="danger">清空</button>
    </div>
  </header>

  <aside id="left">
    <div class="sec">
      <h3>① 文件浏览</h3>
      <div class="row"><input id="lbDir" placeholder="Luban json 输出目录 / Excel 源表目录" style="flex:1"><button id="lbGo">列出</button></div>
      <div class="row"><button id="lbUp" class="sm">上级</button><span id="lbCur" class="dim ell" style="flex:1"></span></div>
      <div id="lbList" class="filelist" style="max-height:150px"></div>
    </div>
    <div class="sec">
      <h3>② 已注册数据表 <span class="dim" style="font-weight:400">表达式里按别名引用</span><button id="tblReloadAll" class="sm" style="margin-left:auto" title="Luban 重新导表后点这里，所有引用即时更新">全部刷新</button></h3>
      <div id="tblList" class="filelist" style="max-height:130px"></div>
    </div>
    <div class="sec grow" style="border-bottom:none">
      <h3 id="lbTitle">③ 表预览</h3>
      <div id="lbSheetBar" class="row" style="display:none"><span class="dim">Sheet</span><select id="lbSheet" style="flex:1"></select></div>
      <div id="lbReg" class="bindbar"></div>
      <div id="lbBind" class="bindbar"></div>
      <div id="lbTable" class="tablewrap"></div>
    </div>
  </aside>

  <main id="center">
    <canvas id="cv"></canvas>
    <div id="modeTip"></div>
    <div id="legendTip">
      <span>行为状态：</span>
      <span><i style="background:#3ecf6e"></i>已执行</span>
      <span><i style="background:#5a6070"></i>未到触发</span>
      <span><i style="background:#b26bff"></i>条件不满足</span>
      <span><i style="background:#9aa7ff"></i>概率未中</span>
      <span><i style="background:#ff5d5d"></i>资源不足</span>
      <span><i style="background:#ffa940"></i>目标已满</span>
    </div>
  </main>

  <aside id="right">
    <div class="sec" id="props"></div>
    <div class="sec">
      <h3>检查</h3>
      <div id="errs"></div>
    </div>
    <div class="sec" id="chartSec" style="border-bottom:none">
      <h3>生命周期曲线 <label class="chk" style="margin-left:auto" title="每条曲线按自身最小~最大值缩放，便于对比量级差很大的数值（悬停仍显示真实值）"><input type="checkbox" id="normChk">各自归一化</label></h3>
      <canvas id="chart"></canvas>
      <div id="legend"></div>
    </div>
  </aside>
</div>
<div id="toast"></div>

<script>
  if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', () => {
    document.body.innerHTML = '<div style="padding:48px;font-size:16px;line-height:1.8;color:#d8dce6">num-sim 使用浏览器原生 ES 模块，不能直接双击 index.html 打开。<br>请双击 <b>start.bat</b> 启动本地服务，然后访问 <b>http://localhost:8787</b>。</div>';
  });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
