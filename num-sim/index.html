<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>num-sim · 数值沙盘</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#14161b;--panel:#1b1e25;--panel2:#242833;--line:#2e3340;--text:#d8dce6;--dim:#8a91a3;--acc:#4f8cff;--err:#ff5d5d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:360px minmax(0,1fr) 390px;height:100vh}
header{grid-column:1/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;margin-right:6px;color:#fff}
header .brand small{color:var(--dim);font-weight:400;margin-left:4px}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:none}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{border-color:#566078}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary{background:#2f6fea;border-color:#2f6fea;color:#fff}
button.danger{border-color:#6b2d2d;color:#ff9a9a}
button.sm{padding:1px 7px;font-size:12px}
input,select{background:#10121a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font:inherit;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input.bad{border-color:var(--err)}
input[data-expr]{font-family:Consolas,"Microsoft YaHei",monospace}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;flex:none}
.dot.sq{border-radius:2px}
label.chk{display:flex;gap:4px;align-items:center;color:var(--dim);cursor:pointer;font-weight:400}
#tickInfo{color:var(--dim);min-width:70px}
aside{background:var(--panel);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
#center{position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#modeTip{position:absolute;left:10px;top:8px;color:var(--dim);font-size:12px;pointer-events:none;background:#14161bcc;padding:2px 8px;border-radius:4px}
#legendTip{position:absolute;left:10px;bottom:8px;color:var(--dim);font-size:11px;pointer-events:none;background:#14161bcc;padding:3px 8px;border-radius:4px;display:flex;gap:10px}
#legendTip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:0}
.sec{padding:9px 10px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 7px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.grow{flex:1;min-height:0;display:flex;flex-direction:column}
.row{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.dim{color:var(--dim)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#15171e}
.fi{display:flex;gap:6px;align-items:center;padding:3px 8px;cursor:pointer;border-bottom:1px solid #20242d}
.fi:hover{background:#252a36}
.fi.cur{background:#253553}
.fi .tag{font-size:10px;padding:0 4px;border-radius:3px;background:#30364a;color:#aab;min-width:34px;text-align:center;flex:none}
.fi .tag.dir{background:#3a3320;color:#e8c46a}
.fi .tag.tbl{background:#1f3a35;color:#5fe0c4}
.fi .sz{margin-left:auto;color:var(--dim);font-size:11px;flex:none}
.tablewrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#15171e}
table{border-collapse:collapse;font-size:12px}
th,td{border:1px solid #262a35;padding:2px 6px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:#222634;color:#b8bfd0;z-index:1}
th.key{color:#ffd479}
td.idx,th.idx{color:var(--dim);background:#1b1e27;position:sticky;left:0}
td{cursor:pointer}
tr:hover td{background:#1f2533}
tr.row-on td{background:#23324f}
td.cell-on{background:#2f6fea !important;color:#fff}
.bindbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px;min-height:22px}
code,.ref{background:#10121a;padding:1px 6px;border-radius:4px;color:#ffd479;font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}
.bindbar code{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#props{flex:1;overflow:auto}
.ptitle{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center}
.sub{font-size:11px;color:#7d869c;font-weight:600;letter-spacing:.5px;margin:12px 0 7px;border-top:1px solid var(--line);padding-top:8px}
.field{margin-bottom:10px}
.field>label{display:block;color:var(--dim);font-size:12px;margin-bottom:3px}
.field>input,.field>select{width:100%}
.field.io{margin-bottom:5px}
.ioname{width:110px;flex:none}
.hint{color:#6f7689;font-size:11px;margin-top:2px}
.err{color:var(--err);font-size:12px;margin-top:2px}
.err:empty{display:none}
.fields{border:1px solid var(--line);border-radius:6px;margin-top:4px;max-height:150px;overflow:auto}
.fld{display:flex;gap:8px;padding:2px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid #20242d}
.fld:hover{background:#26304a}
.fld span:first-child{color:#5fe0c4;min-width:80px;flex:none}
.diag{font-size:12px;padding:4px 8px;border-radius:5px;margin-bottom:4px}
.diag.ok{background:#1d3326;color:#7ee0a0}
.diag.no{background:#3a2328;color:#ffaaaa}
.diag.idle{background:#252a36;color:#aab}
.help{color:#aeb4c2;font-size:12px}
.help ol,.help ul{padding-left:18px;margin:4px 0 10px}
.help li{margin-bottom:2px}
#errs{max-height:110px;overflow:auto}
#errs:empty::before{content:"无错误";color:var(--dim);font-size:12px}
.eitem{color:var(--err);font-size:12px;cursor:pointer;padding:1px 0}
.eitem:hover{text-decoration:underline}
#chartSec{height:330px;display:flex;flex-direction:column}
#chart{width:100%;flex:1;min-height:0;display:block;background:#12141a;border-radius:6px;border:1px solid var(--line)}
#legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;max-height:64px;overflow:auto}
.lg{cursor:pointer;font-size:12px;user-select:none}
.lg.off{opacity:.35}
.lg i{display:inline-block;width:10px;height:3px;vertical-align:3px;margin-right:4px}
.lg b{font-weight:600;color:#fff;margin-left:3px}
#ac{position:fixed;z-index:20;display:none;background:#1f232d;border:1px solid #3a4052;border-radius:6px;max-height:300px;overflow:auto;box-shadow:0 6px 24px #0008;font-size:12px}
#ac .act{padding:3px 8px;color:var(--dim);font-size:11px;border-bottom:1px solid #2e3340;position:sticky;top:0;background:#1f232d}
.aci{display:flex;gap:8px;padding:3px 8px;cursor:pointer;align-items:center;white-space:nowrap}
.aci:hover{background:#2a3040}
.aci.on{background:#2f6fea;color:#fff}
.aci.on .d{color:#dfe7ff}
.aci .k{font-size:10px;padding:0 4px;border-radius:3px;min-width:30px;text-align:center;flex:none}
.aci .m{font-family:Consolas,"Microsoft YaHei",monospace}
.aci .d{color:var(--dim);overflow:hidden;text-overflow:ellipsis;margin-left:auto;padding-left:12px;max-width:240px}
.aci .d.bad{color:#c77}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3142;border:1px solid #445;color:#fff;padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:70vw}
#toast.show{opacity:1}
#toast.bad{border-color:var(--err)}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">num-sim<small>数值沙盘</small></span>
    <div class="grp">
      <button data-mode="select" title="V">选择</button>
      <button data-mode="link" title="L">连线</button>
      <button data-mode="delete" title="X">删除</button>
    </div>
    <div class="grp">
      <button data-mode="add:pool" title="状态：持有数值，可绑定 Luban 数据行"><span class="dot" style="background:#4f8cff"></span>资源池</button>
      <button data-mode="add:action" title="行为：何时（触发/条件/概率）做什么（消耗→产出）"><span class="dot sq" style="background:#f5c542"></span>行为</button>
      <button data-mode="add:formula" title="派生状态：只读的计算值"><span class="dot" style="background:#2ad4d4"></span>公式</button>
    </div>
    <div class="grp">
      <span class="dim">Tick</span><input id="ticks" type="number" min="1" max="100000" value="200" style="width:72px">
      <span class="dim" title="rand/randint/chance 与行为概率使用的随机种子，同一种子结果可复现">种子</span><input id="seed" type="number" value="1" style="width:56px">
      <button class="primary" id="btnRun">运行</button>
      <button id="btnStep">单步</button>
      <button id="btnReset">重置</button>
      <label class="chk" title="修改图后自动按上次的 tick 数重跑"><input type="checkbox" id="autoRerun" checked>改图自动重跑</label>
      <span id="tickInfo">tick 0</span>
    </div>
    <div class="grp">
      <button id="btnCsv">导出CSV</button>
      <button id="btnExport">导出JSON</button>
      <button id="btnImport">导入JSON</button>
      <input type="file" id="fileImport" accept=".json" hidden>
    </div>
    <div class="grp">
      <button id="btnFit">适应视图</button>
      <button id="btnExample">载入示例</button>
      <button id="btnClear" class="danger">清空</button>
    </div>
  </header>

  <aside id="left">
    <div class="sec">
      <h3>① 文件浏览</h3>
      <div class="row"><input id="lbDir" placeholder="Luban json 输出目录 / Excel 源表目录" style="flex:1"><button id="lbGo">列出</button></div>
      <div class="row"><button id="lbUp" class="sm">上级</button><span id="lbCur" class="dim ell" style="flex:1"></span></div>
      <div id="lbList" class="filelist" style="max-height:150px"></div>
    </div>
    <div class="sec">
      <h3>② 已注册数据表 <span class="dim" style="font-weight:400">表达式里按别名引用</span><button id="tblReloadAll" class="sm" style="margin-left:auto" title="Luban 重新导表后点这里，所有引用即时更新">全部刷新</button></h3>
      <div id="tblList" class="filelist" style="max-height:130px"></div>
    </div>
    <div class="sec grow" style="border-bottom:none">
      <h3 id="lbTitle">③ 表预览</h3>
      <div id="lbSheetBar" class="row" style="display:none"><span class="dim">Sheet</span><select id="lbSheet" style="flex:1"></select></div>
      <div id="lbReg" class="bindbar"></div>
      <div id="lbBind" class="bindbar"></div>
      <div id="lbTable" class="tablewrap"></div>
    </div>
  </aside>

  <main id="center">
    <canvas id="cv"></canvas>
    <div id="modeTip"></div>
    <div id="legendTip">
      <span>行为状态：</span>
      <span><i style="background:#3ecf6e"></i>已执行</span>
      <span><i style="background:#5a6070"></i>未到触发</span>
      <span><i style="background:#b26bff"></i>条件不满足</span>
      <span><i style="background:#9aa7ff"></i>概率未中</span>
      <span><i style="background:#ff5d5d"></i>资源不足</span>
      <span><i style="background:#ffa940"></i>目标已满</span>
    </div>
  </main>

  <aside id="right">
    <div class="sec" id="props"></div>
    <div class="sec">
      <h3>检查</h3>
      <div id="errs"></div>
    </div>
    <div class="sec" id="chartSec" style="border-bottom:none">
      <h3>生命周期曲线 <label class="chk" style="margin-left:auto" title="每条曲线按自身最小~最大值缩放，便于对比量级差很大的数值（悬停仍显示真实值）"><input type="checkbox" id="normChk">各自归一化</label></h3>
      <canvas id="chart"></canvas>
      <div id="legend"></div>
    </div>
  </aside>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trunc = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const fmt = x => {
  if (typeof x !== 'number' || Number.isNaN(x)) return '-';
  if (!Number.isFinite(x)) return x > 0 ? '∞' : '-∞';
  const a = Math.abs(x);
  if (a >= 1e7) return x.toExponential(2);
  if (a > 0 && a < 0.01) return x.toPrecision(2);
  return String(Math.round(x * 100) / 100);
};
let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', bad ? 3500 : 2200);
}
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function toNum(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim();
  if (s === '') return NaN;
  if (/^true$/i.test(s)) return 1;
  if (/^false$/i.test(s)) return 0;
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}
function normKey(k) {
  if (typeof k === 'number') return String(k);
  const s = String(k ?? '').trim();
  return s !== '' && Number.isFinite(Number(s)) ? String(Number(s)) : s;
}
function keyLit(k) { const s = normKey(k); return s !== '' && Number.isFinite(Number(s)) ? s : JSON.stringify(s); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let RNG = mulberry32(1);

/* ================= 数据表运行时（按主键索引的行对象） ================= */
const TBL = {};
function tableRow(alias, key) {
  const t = TBL[alias];
  if (!t || t.status !== 'ok') throw new Error(`数据表 ${alias} 未加载`);
  const row = t.index.get(normKey(key));
  if (!row) throw new Error(`${alias} 中不存在主键 ${keyLit(key)}`);
  return row;
}
function fieldNum(alias, key, row, field) {
  if (!(field in row)) throw new Error(`${alias} 没有字段 ${field}`);
  const x = toNum(row[field]);
  if (Number.isNaN(x)) throw new Error(`${alias}[${keyLit(key)}].${field} = "${row[field]}" 不是数字`);
  return x;
}
const tableGet = (alias, key, field) => fieldNum(alias, key, tableRow(alias, key), field);
function memberGet(name, field) {
  const r = V && V.rowOf[name];
  if (!r) throw new Error(`资源池 ${name} 未绑定数据行`);
  return tableGet(r.table, r.key, field);
}

/* ================= 表达式：递归下降，不使用 eval ================= */
const FUNCS = {
  min: [1, 99, Math.min], max: [1, 99, Math.max],
  floor: [1, 1, Math.floor], ceil: [1, 1, Math.ceil],
  round: [1, 2, (x, n = 0) => { const p = 10 ** n; return Math.round(x * p) / p; }],
  abs: [1, 1, Math.abs], sign: [1, 1, Math.sign], sqrt: [1, 1, Math.sqrt], pow: [2, 2, Math.pow],
  exp: [1, 1, Math.exp], log: [1, 2, (x, b) => b === undefined ? Math.log(x) : Math.log(x) / Math.log(b)], log10: [1, 1, Math.log10],
  clamp: [3, 3, (x, a, b) => Math.min(b, Math.max(a, x))],
  lerp: [3, 3, (a, b, t) => a + (b - a) * t],
  if: [3, 3, null],
  rand: [0, 2, (a, b) => a === undefined ? RNG() : b === undefined ? RNG() * a : a + (b - a) * RNG()],
  randint: [2, 2, (a, b) => { a = Math.ceil(a); b = Math.floor(b); return a + Math.floor(RNG() * (b - a + 1)); }],
  chance: [1, 1, p => RNG() < p ? 1 : 0],
};
const RESERVED = new Set(['tick', ...Object.keys(FUNCS)]);
const ID_START = /[\p{L}_]/u, ID_PART = /[\p{L}\p{N}_]/u;
const IDENT_RE = /^[\p{L}_][\p{L}\p{N}_]*$/u;

function tokenize(src) {
  const toks = []; let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++;
      const s = src.slice(i, j);
      if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) throw new Error(`非法数字 "${s}" @${i + 1}`);
      toks.push({ t: 'num', v: parseFloat(s), p: i, e: j }); i = j; continue;
    }
    if (c === '"' || c === "'") {
      const j = src.indexOf(c, i + 1);
      if (j < 0) throw new Error(`字符串缺少结束引号 @${i + 1}`);
      toks.push({ t: 'str', v: src.slice(i + 1, j), p: i, e: j + 1 }); i = j + 1; continue;
    }
    if (ID_START.test(c)) {
      let j = i + 1; while (j < src.length && ID_PART.test(src[j])) j++;
      toks.push({ t: 'id', v: src.slice(i, j), p: i, e: j }); i = j; continue;
    }
    const two = src.substr(i, 2);
    if (['>=', '<=', '==', '!=', '&&', '||'].includes(two)) { toks.push({ t: 'op', v: two, p: i, e: i + 2 }); i += 2; continue; }
    if ('+-*/%^()<>!,?:[].'.includes(c)) { toks.push({ t: 'op', v: c, p: i, e: i + 1 }); i++; continue; }
    throw new Error(`非法字符 "${c}" @${i + 1}`);
  }
  return toks;
}

/**
 * 语法（优先级从低到高）：
 *   c ? a : b   ||   &&   比较   + -   * / %   一元 - + !   ^（右结合）
 *   数字 | (expr) | 函数(args) | 变量 | 表[主键].字段 | 资源池.字段
 */
function compile(src) {
  const toks = tokenize(src); let k = 0;
  const ids = new Set(), refs = [];
  const isOp = v => toks[k] && toks[k].t === 'op' && toks[k].v === v;
  const where = () => toks[k] ? ` @${toks[k].p + 1}` : ' @末尾';
  const eat = v => { if (!isOp(v)) throw new Error(`缺少 "${v}"${where()}`); k++; };
  const fieldChain = () => {
    const t = toks[k];
    if (!t || t.t !== 'id') throw new Error(`"." 后缺少字段名${where()}`);
    const parts = [t.v]; k++;
    while (isOp('.') && toks[k + 1] && toks[k + 1].t === 'id') { parts.push(toks[k + 1].v); k += 2; }
    return parts.join('.');
  };
  const bin = (next, ops, mk) => () => {
    let a = next();
    while (toks[k] && toks[k].t === 'op' && ops.includes(toks[k].v)) { const op = toks[k++].v, l = a, r = next(); a = mk(op, l, r); }
    return a;
  };
  const pPrim = () => {
    const t = toks[k];
    if (!t) throw new Error('表达式不完整 @末尾');
    if (t.t === 'num') { k++; const v = t.v; return () => v; }
    if (t.t === 'str') throw new Error(`字符串只能用作数据表主键，例如 表["${t.v}"].字段 @${t.p + 1}`);
    if (t.t === 'id') {
      k++; const name = t.v;
      if (isOp('(')) {
        const spec = FUNCS[name]; if (!spec) throw new Error(`未知函数 "${name}"`);
        k++;
        const args = [];
        if (!isOp(')')) { args.push(pTern()); while (isOp(',')) { k++; args.push(pTern()); } }
        eat(')');
        if (args.length < spec[0] || args.length > spec[1])
          throw new Error(`${name}() 需要 ${spec[0] === spec[1] ? spec[0] : spec[0] + '~' + spec[1]} 个参数，实际 ${args.length} 个`);
        if (name === 'if') { const [c, a, b] = args; return v => c(v) ? a(v) : b(v); }
        const f = spec[2];
        if (args.length === 0) return () => f();
        if (args.length === 1) { const [a] = args; return v => f(a(v)); }
        return v => f(...args.map(a => a(v)));
      }
      if (isOp('[')) {
        k++;
        let keyFn, keyConst;
        if (toks[k] && toks[k].t === 'str') { keyConst = toks[k].v; k++; const kv = keyConst; keyFn = () => kv; }
        else {
          const s0 = k; keyFn = pTern();
          if (k - s0 === 1 && toks[s0].t === 'num') keyConst = toks[s0].v;
        }
        eat(']');
        if (!isOp('.')) throw new Error(`表引用需要指定字段，例如 ${name}[主键].字段${where()}`);
        k++;
        const field = fieldChain();
        refs.push({ kind: 'table', alias: name, keyConst, field });
        return v => tableGet(name, keyFn(v), field);
      }
      if (isOp('.')) {
        k++;
        const field = fieldChain();
        refs.push({ kind: 'member', name, field });
        return () => memberGet(name, field);
      }
      ids.add(name);
      return v => v[name];
    }
    if (isOp('(')) { k++; const e = pTern(); eat(')'); return e; }
    throw new Error(`意外的 "${t.v}"${where()}`);
  };
  const pPow = () => {
    const b = pPrim();
    if (isOp('^')) { k++; const e = pUnary(); return v => Math.pow(b(v), e(v)); }
    return b;
  };
  const pUnary = () => {
    if (isOp('-')) { k++; const a = pUnary(); return v => -a(v); }
    if (isOp('+')) { k++; return pUnary(); }
    if (isOp('!')) { k++; const a = pUnary(); return v => a(v) ? 0 : 1; }
    return pPow();
  };
  const pMul = bin(pUnary, ['*', '/', '%'], (op, l, r) => op === '*' ? v => l(v) * r(v) : op === '/' ? v => l(v) / r(v) : v => l(v) % r(v));
  const pAdd = bin(pMul, ['+', '-'], (op, l, r) => op === '+' ? v => l(v) + r(v) : v => l(v) - r(v));
  const CMP = { '>=': (a, b) => a >= b, '<=': (a, b) => a <= b, '>': (a, b) => a > b, '<': (a, b) => a < b, '==': (a, b) => a === b, '!=': (a, b) => a !== b };
  const pCmp = bin(pAdd, Object.keys(CMP), (op, l, r) => { const f = CMP[op]; return v => f(l(v), r(v)) ? 1 : 0; });
  const pAnd = bin(pCmp, ['&&'], (op, l, r) => v => (l(v) && r(v)) ? 1 : 0);
  const pOr = bin(pAnd, ['||'], (op, l, r) => v => (l(v) || r(v)) ? 1 : 0);
  const pTern = () => {
    const c = pOr();
    if (isOp('?')) { k++; const a = pTern(); eat(':'); const b = pTern(); return v => c(v) ? a(v) : b(v); }
    return c;
  };
  if (!toks.length) throw new Error('表达式为空');
  const fn = pTern();
  if (k < toks.length) throw new Error(`多余的内容 "${toks[k].v}"${where()}`);
  return { fn, ids: [...ids], refs };
}

/** 重命名表达式中的标识符（跳过 "." 之后的字段名与函数名） */
function renameInExpr(src, oldName, newName) {
  if (src === undefined || src === null || src === '') return src;
  let toks; try { toks = tokenize(String(src)); } catch (_) { return src; }
  let s = String(src);
  for (let i = toks.length - 1; i >= 0; i--) {
    const t = toks[i], nx = toks[i + 1], pv = toks[i - 1];
    if (t.t !== 'id' || t.v !== oldName) continue;
    if (nx && nx.t === 'op' && nx.v === '(') continue;
    if (pv && pv.t === 'op' && pv.v === '.') continue;
    s = s.slice(0, t.p) + newName + s.slice(t.e);
  }
  return s;
}

/* ================= 图模型：状态（资源池/公式）+ 行为 ================= */
const TYPES = {

/** 旧模型（产出源/消耗口/转换器/条件门 + rate 连线）→ 新模型（资源池 + 行为） */
function migrateOld(g) {
  const on = (g.nodes || []).filter(Boolean), oe = (g.edges || []).filter(Boolean);
  const byId = id => on.find(n => n.id === id);
  const isPool = n => n && n.type === 'pool';
  const nodes = [], edges = [];
  let seq = Math.max(1000, (Number(g.nextId) || 0) + 1000);
  const gen = p => p + (seq++);
  for (const n of on) if (n.type === 'pool' || n.type === 'formula') nodes.push({ ...n });
  const act = (name, x, y, o) => { const a = actionDefaults({ id: gen('a'), type: 'action', name, x: Math.round(x), y: Math.round(y), ...o }); nodes.push(a); return a; };
  const link = (from, to, amount) => edges.push({ id: gen('e'), from, to, amount: String(amount ?? '').trim() || '1' });
  const mid = (a, b) => [(a.x + b.x) / 2, (a.y + b.y) / 2];
  for (const e of oe) {
    const a = byId(e.from), b = byId(e.to); if (!a || !b) continue;
    const rate = String(e.rate ?? '').trim() || '1';
    if (a.type === 'source' && isPool(b)) link(act(a.name, ...mid(a, b), {}).id, b.id, rate);
    else if (isPool(a) && b.type === 'drain') { const x = act(b.name, ...mid(a, b), { mode: 'partial' }); link(a.id, x.id, rate); }
    else if (isPool(a) && isPool(b)) { const x = act(`${a.name}转${b.name}`, ...mid(a, b), { mode: 'partial', compact: true }); link(a.id, x.id, rate); link(x.id, b.id, rate); }
  }
  for (const c of on.filter(n => n.type === 'converter')) {
    const ins = oe.filter(e => e.to === c.id).map(e => byId(e.from)).filter(isPool);
    const outs = oe.filter(e => e.from === c.id).map(e => byId(e.to)).filter(isPool);
    const x = act(c.name, c.x, c.y, { mode: 'all', compact: ins.length === 1 && outs.length === 1 });
    ins.forEach(p => link(p.id, x.id, c.rateIn)); outs.forEach(p => link(x.id, p.id, c.rateOut));
  }
  for (const gt of on.filter(n => n.type === 'gate')) {
    const targets = oe.filter(e => e.from === gt.id).map(e => ({ n: byId(e.to), lim: String(e.rate ?? '').trim() })).filter(t => isPool(t.n));
    for (const ein of oe.filter(e => e.to === gt.id)) {
      const src = byId(ein.from); if (!src) continue;
      const rate = String(ein.rate ?? '').trim() || '1';
      const x = act(gt.name, gt.x, gt.y, { mode: 'partial', condition: gt.condition || '' });
      if (isPool(src)) link(src.id, x.id, rate);
      targets.forEach(t => link(x.id, t.n.id, t.lim || rate));
    }
  }
  const seen = new Set();
  for (const n of nodes) {
    const base = String(n.name || TYPES[n.type].label); let nm = base, i = 2;
    while (seen.has(nm)) nm = base + '_' + i++;
    n.name = nm; seen.add(nm);
  }
  return { ...g, version: 3, nodes, edges, nextId: seq };
}

let lastMigrated = false;
function normalizeGraph(g) {
  lastMigrated = false;
  if (!g.version || g.version < 3) { g = migrateOld(g); lastMigrated = true; }
  g.version = 3;
  g.nodes = (g.nodes || []).filter(n => n && n.id && TYPES[n.type]);
  const ids = new Set(g.nodes.map(n => n.id));
  g.edges = (g.edges || []).filter(e => e && e.id && ids.has(e.from) && ids.has(e.to));
  g.tables = Array.isArray(g.tables) ? g.tables.filter(t => t && t.alias && t.path) : [];
  if (!Number.isFinite(Number(g.seed))) g.seed = 1;
  for (const n of g.nodes) {
    n.x = Number(n.x) || 0; n.y = Number(n.y) || 0;
    if (n.type === 'pool') {
      n.init = n.init === undefined || n.init === null ? '0' : String(n.init);
      n.cap = n.cap === undefined || n.cap === null ? '' : String(n.cap);
      if (n.row && (!n.row.table || n.row.key === undefined)) delete n.row;
      delete n.bind;
    }
    if (n.type === 'formula' && (n.expr === undefined || n.expr === null)) n.expr = '0';
    if (n.type === 'action') actionDefaults(n);
  }
  for (const e of g.edges) { e.amount = e.amount === undefined || e.amount === null ? '' : String(e.amount); delete e.rate; delete e.bind; }
  let mx = 0;
  for (const o of [...g.nodes, ...g.edges]) { const m = /\d+$/.exec(o.id); if (m) mx = Math.max(mx, +m[0]); }
  g.nextId = Math.max(Number(g.nextId) || 0, mx + 1);
  return g;
}
function loadGraph() {
  for (const key of [LS_GRAPH, ...LS_OLD]) {
    try {
      const g = JSON.parse(localStorage.getItem(key));
      if (g && Array.isArray(g.nodes) && Array.isArray(g.edges)) return normalizeGraph(g);
    } catch (_) { /* ignore */ }
  }
  return null;
}

let G = loadGraph();
const bootMigrated = lastMigrated;
const firstRun = !G;
if (!G) G = normalizeGraph(exampleGraph());

const nodeById = id => G.nodes.find(n => n.id === id);
const edgeById = id => G.edges.find(e => e.id === id);
const genId = p => p + (G.nextId++);
const tableDef = alias => G.tables.find(t => t.alias === alias);

function saveGraph() {
  G.view = { ...ui.view };
  localStorage.setItem(LS_GRAPH, JSON.stringify(G));
}
function forEachExpr(cb) {
  for (const n of G.nodes) for (const f of NODE_EXPR) if (typeof n[f] === 'string') n[f] = cb(n[f]);
  for (const e of G.edges) e.amount = cb(e.amount);
}

/* ================= 校验 / 编译 ================= */
function edgeKind(e) {
  const a = nodeById(e.from), b = nodeById(e.to);
  if (!a || !b) return { k: 'bad', msg: '端点不存在' };
  if (a.type === 'pool' && b.type === 'action') return { k: 'in' };
  if (a.type === 'action' && b.type === 'pool') return { k: 'out' };
  if (a.type === 'formula' || b.type === 'formula') return { k: 'bad', msg: '公式不参与资源流动，直接在表达式中引用其名称即可' };
  if (a.type === 'pool' && b.type === 'pool') return { k: 'bad', msg: '资源池之间需要通过行为连接（连线模式下依次点两个资源池会自动创建「转移」行为）' };
  return { k: 'bad', msg: '行为之间不能直接相连，中间需要资源池' };
}
const ownerAction = e => { const a = nodeById(e.from), b = nodeById(e.to); return a && a.type === 'action' ? a : b && b.type === 'action' ? b : null; };

let V = null;
function validate() {
  const err = {}, ids = new Set(), comp = {}, kind = {}, rowOf = {}, io = {}, compact = new Set();
  const put = (id, f, msg) => { if (!err[id + ':' + f]) err[id + ':' + f] = msg; ids.add(id); };
  const pools = G.nodes.filter(n => n.type === 'pool'), forms = G.nodes.filter(n => n.type === 'formula');
  const actions = G.nodes.filter(n => n.type === 'action');
  const poolByName = {}; pools.forEach(p => { poolByName[p.name] = p; if (p.row) rowOf[p.name] = p.row; });
  const formByName = {}; forms.forEach(f => formByName[f.name] = f);
  const aliases = new Set(G.tables.map(t => t.alias));
  const known = new Set(['tick', ...pools.map(p => p.name), ...forms.map(f => f.name)]);

  const refErr = r => {
    let alias, key;
    if (r.kind === 'member') {
      const p = poolByName[r.name];
      if (!p) return aliases.has(r.name) ? `数据表需写主键：${r.name}[主键].${r.field}` : `"${r.name}" 不是资源池，不能使用 .${r.field}`;
      if (!p.row) return `资源池 ${r.name} 未绑定数据行，不能使用 .${r.field}`;
      alias = p.row.table; key = p.row.key;
    } else { alias = r.alias; key = r.keyConst; }
    if (!aliases.has(alias)) return `未注册的数据表 "${alias}"`;
    const t = TBL[alias];
    if (!t || t.status === 'loading') return `数据表 ${alias} 加载中`;
    if (t.status === 'error') return `数据表 ${alias} 加载失败：${t.error}`;
    if (!t.cols.includes(r.field)) return `${alias} 没有字段 "${r.field}"`;
    if (key !== undefined) {
      const row = t.index.get(normKey(key));
      if (!row) return `${alias} 中不存在主键 ${keyLit(key)}`;
      if (Number.isNaN(toNum(row[r.field]))) return `${alias}[${keyLit(key)}].${r.field} = "${row[r.field]}" 不是数字`;
    }
    return null;
  };
  const cc = (id, f, src, opt = {}) => {
    const s = String(src ?? '').trim();
    if (!s) { if (opt.allowEmpty) comp[id + ':' + f] = null; else put(id, f, opt.emptyMsg || '不能为空'); return null; }
    try {
      const c = compile(s);
      if (opt.init && c.ids.length) throw new Error(`初始值只能使用常量和数据表字段，不能引用 ${c.ids.join('、')}`);
      const unk = c.ids.filter(x => !known.has(x));
      if (unk.length) {
        const tb = unk.find(x => aliases.has(x));
        throw new Error(tb ? `${tb} 是数据表，用法：${tb}[主键].字段` : '未知变量：' + unk.join('、'));
      }
      for (const r of c.refs) { const m = refErr(r); if (m) throw new Error(m); }
      comp[id + ':' + f] = c.fn;
      return c;
    } catch (e) { put(id, f, e.message); return null; }
  };

  const seen = {};
  for (const n of G.nodes) {
    const nm = String(n.name ?? '').trim();
    const isVar = n.type === 'pool' || n.type === 'formula';
    if (!nm) put(n.id, 'name', '名称不能为空');
    else if (seen[nm]) put(n.id, 'name', `名称 "${nm}" 重复`);
    else if (isVar && !IDENT_RE.test(nm)) put(n.id, 'name', '名称需为合法标识符（中英文/数字/下划线，不以数字开头）');
    else if (isVar && RESERVED.has(nm)) put(n.id, 'name', `"${nm}" 是保留字`);
    else if (isVar && aliases.has(nm)) put(n.id, 'name', `"${nm}" 与数据表别名重名`);
    seen[nm] = true;
  }
  for (const e of G.edges) {
    const ki = edgeKind(e); kind[e.id] = ki.k;
    if (ki.k === 'bad') { put(e.id, 'kind', ki.msg); continue; }
    cc(e.id, 'amount', e.amount, { emptyMsg: '数量不能为空' });
  }
  const deps = {};
  for (const n of G.nodes) {
    if (n.type === 'pool') {
      if (n.row) {
        if (!aliases.has(n.row.table)) put(n.id, 'row', `数据表 ${n.row.table} 未注册`);
        else {
          const t = TBL[n.row.table];
          if (t && t.status === 'ok' && !t.index.has(normKey(n.row.key))) put(n.id, 'row', `${n.row.table} 中不存在主键 ${keyLit(n.row.key)}`);
        }
      }
      cc(n.id, 'init', n.init, { init: true, allowEmpty: true });
      cc(n.id, 'cap', n.cap, { allowEmpty: true });
    }
    if (n.type === 'formula') {
      const c = cc(n.id, 'expr', n.expr);
      deps[n.id] = c ? c.ids.filter(x => formByName[x]).map(x => formByName[x].id) : [];
    }
    if (n.type === 'action') {
      const ins = G.edges.filter(e => e.to === n.id && kind[e.id] === 'in');
      const outs = G.edges.filter(e => e.from === n.id && kind[e.id] === 'out');
      io[n.id] = { ins, outs };
      if (n.compact && ins.length === 1 && outs.length === 1 && ins[0].from !== outs[0].to) compact.add(n.id);
      if (!ins.length && !outs.length) put(n.id, 'kind', '行为没有连接任何资源：资源池 → 行为 = 消耗，行为 → 资源池 = 产出');
      if (n.trigger === 'every') cc(n.id, 'every', n.every, { emptyMsg: '请填写间隔 N' });
      cc(n.id, 'condition', n.condition, { allowEmpty: n.trigger !== 'rise', emptyMsg: '「条件变为真时」触发需要填写条件' });
      cc(n.id, 'chance', n.chance, { allowEmpty: true });
      cc(n.id, 'times', n.times, { allowEmpty: true });
    }
  }
  const state = {}, order = [];
  const visit = (id, stack) => {
    if (state[id] === 2) return;
    if (state[id] === 1) {
      const cyc = stack.slice(stack.indexOf(id));
      const txt = [...cyc, id].map(i => nodeById(i).name).join(' → ');
      cyc.forEach(i => put(i, 'expr', '循环依赖：' + txt));
      return;
    }
    state[id] = 1; stack.push(id);
    for (const d of deps[id] || []) visit(d, stack);
    stack.pop(); state[id] = 2; order.push(id);
  };
  forms.forEach(f => visit(f.id, []));
  return { err, ids, comp, kind, rowOf, order, io, compact, actions };
}

/* ================= 模拟引擎 =================
 * 每 tick：
 *   1. 快照资源池 → 按依赖顺序计算公式与资源池上限
 *   2. 按行为顺序（优先级）逐个执行：触发 → 条件 → 概率 → 资源检查 → 消耗 → 产出
 *      每次执行后立即刷新变量与公式，后面的行为（以及同一行为的重复执行）看到最新状态
 *   3. 记录快照
 */
let sim = null, runtimeErr = null;
class SimErr extends Error { constructor(id, msg) { super(msg); this.id = id; } }
const newStats = () => ({ fired: 0, trigger: 0, cond: 0, chance: 0, short: 0, full: 0, shortBy: {} });

function evalAt(fn, vars, id, what) {
  let x;
  try { x = fn(vars); } catch (e) { throw new SimErr(id, `${what}：${e.message}`); }
  if (typeof x !== 'number' || !Number.isFinite(x)) throw new SimErr(id, `${what} 结果为 ${x}（tick ${vars.tick}）`);
  return x;
}
function snapshotVars(t) {
  const vars = { tick: t };
  for (const n of G.nodes) if (n.type === 'pool') vars[n.name] = sim.val[n.id];
  return vars;
}
function refreshDerived(vars) {
  for (const id of V.order) {
    const f = nodeById(id);

function runAction(a, t, vars, flows) {

  }
  h += selectHtml('执行方式', 'mode', a.mode, MODES, '全有或全无：任一消耗不足则整次不执行；尽量执行：按最短缺资源的比例部分执行');
  h += fieldHtml('每 tick 最多执行次数', 'times', a.times, a.id, '留空 = 1；条件与资源仍满足时在同一 tick 内重复执行（如一次升多级），上限 1000');
  if (io.ins.length === 1 && io.outs.length === 1 && io.ins[0].from !== io.outs[0].to)
    h += `<label class="chk" style="margin-bottom:10px"><input type="checkbox" data-act="compact" ${a.compact ? 'checked' : ''}>显示为连线（1 进 1 出时可折叠成一条线）</label>`;
  h += `<div class="field"><label>结算顺序</label><div class="row">第 ${idx + 1} / ${acts.length} 个行为
    <button class="sm" data-act="up" ${idx === 0 ? 'disabled' : ''}>提前</button>
    <button class="sm" data-act="down" ${idx === acts.length - 1 ? 'disabled' : ''}>延后</button></div>
    <div class="hint">多个行为争抢同一资源时，靠前者优先</div></div>`;
  h += `<div class="sub">诊断</div><div id="diagBox"></div>`;
  return h;
}

function bindNodePanel(box, n) {
  box.querySelectorAll('input[data-f]').forEach(inp => {
    const f = inp.dataset.f;
    if (f === 'name') inp.addEventListener('change', () => {
      if (!document.body.contains(inp)) return;
      const v = inp.value.trim();
      if (n.type === 'pool' && tryBindByText(n, v, inp)) return;
      renameNode(n, v, inp);
    });
    else inp.addEventListener('input', () => { n[f] = inp.value; changed(); });
  });
  box.querySelectorAll('select[data-f]').forEach(sel => sel.addEventListener('change', () => { n[sel.dataset.f] = sel.value; changed(); renderPanel(); }));
  box.querySelectorAll('input[data-edge]').forEach(inp => inp.addEventListener('input', () => { const e = edgeById(inp.dataset.edge); if (e) { e.amount = inp.value; changed(); } }));
  const xf = box.querySelector('input[data-xfer]');
  if (xf) xf.addEventListener('input', () => { const io = V.io[n.id]; io.ins[0].amount = xf.value; io.outs[0].amount = xf.value; changed(); });
  box.querySelectorAll('[data-deledge]').forEach(b => b.onclick = () => { delEdge(b.dataset.deledge); renderPanel(); });
  box.querySelectorAll('select[data-add]').forEach(sel => sel.addEventListener('change', () => {
    if (!sel.value) return;
    if (sel.dataset.add === 'in') linkNodes(sel.value, n.id); else linkNodes(n.id, sel.value);
  }));
  const cp = box.querySelector('[data-act=compact]');
  if (cp) cp.onchange = () => { if (cp.checked) n.compact = true; else expandAction(n); changed(); renderPanel(); };
  const up = box.querySelector('[data-act=up]'); if (up) up.onclick = () => moveAction(n, -1);
  const dn = box.querySelector('[data-act=down]'); if (dn) dn.onclick = () => moveAction(n, 1);
  const ub = box.querySelector('[data-act=unbind]'); if (ub) ub.onclick = () => { delete n.row; changed(); renderPanel(); };

  if (rn) rn.onclick = () => { const m = applyRename(n, uniqueNameExcept(rowVarName(n.row.table, n.row.key), n)); if (m) toast(m, true); changed(); renderPanel(); };
  box.querySelectorAll('[data-ins]').forEach(el => { el.onmousedown = ev => ev.preventDefault(); el.onclick = () => insertRef(el.dataset.ins); });
  box.querySelector('[data-act=del]').onclick = deleteSelection;
}

function renderDiag() {
  const box = document.getElementById('diagBox'); if (!box) return;
  const n = ui.sel && ui.sel.kind === 'node' ? nodeById(ui.sel.id) : null; if (!n) return;
  const T = sim ? sim.tick : 0;
  let h = '';
  if (n.type === 'action') {
    const info = sim && sim.act[n.id], st = sim && sim.stats[n.id];
    if (!T || !info || !st) h = '<div class="hint">运行后显示：本 tick 是否执行、为什么没执行、累计统计</div>';
    else {
      if (info.n) h += `<div class="diag ok">tick ${T}：执行 ${info.n} 次${info.reason && info.reason !== 'trigger' ? `，之后因${reasonText(info)}停止` : ''}</div>`;
      else h += `<div class="diag ${info.reason === 'trigger' ? 'idle' : 'no'}">tick ${T}：未执行 —— ${esc(reasonText(info))}</div>`;
      h += `<div class="hint">累计执行 ${st.fired} 次 / ${T} tick</div>`;
      const parts = [];
      if (st.trigger) parts.push(`未到触发 ${st.trigger}`);
      if (st.cond) parts.push(`条件不满足 ${st.cond}`);
      if (st.chance) parts.push(`概率未中 ${st.chance}`);
      if (st.short) parts.push(`资源不足 ${st.short}（${Object.entries(st.shortBy).map(([k, v]) => `${k} ${v}`).join('，')}）`);
      if (st.full) parts.push(`目标已满 ${st.full}`);
      if (parts.length) h += `<div class="hint">未执行的 tick：${esc(parts.join(' · '))}</div>`;
    }
  } else if (n.type === 'pool') {
    const cap = sim && sim.cap[n.id];
    h += `<div class="hint" style="margin-bottom:4px">当前值 <b style="color:#fff">${fmt(sim ? sim.val[n.id] : NaN)}</b>${cap !== undefined && Number.isFinite(cap) ? ` / 上限 ${fmt(cap)}` : ''}（tick ${T}）</div>`;
    const rel = G.edges.filter(e => (e.from === n.id && V.kind[e.id] === 'in') || (e.to === n.id && V.kind[e.id] === 'out'));
    if (!rel.length) h += '<div class="hint">没有行为使用该资源池。连线模式下：资源池→行为 = 消耗，行为→资源池 = 产出</div>';
    else h += '<div class="fields">' + rel.map(e => {
      const isIn = V.kind[e.id] === 'in', a = nodeById(isIn ? e.to : e.from);
      const fl = T && sim.flows[e.id] !== undefined ? ` ▸${fmt(sim.flows[e.id])}` : '';
      return `<div class="fld" data-goto="${a.id}" title="点击编辑该行为"><span style="color:${isIn ? '#ff9a9a' : '#7ee0a0'}">${isIn ? '− 被消耗' : '+ 被产出'}</span><span class="ell">${esc(a.name)} × ${esc(e.amount)}${fl}</span></div>`;
    }).join('') + '</div>';
  } else if (n.type === 'formula') {
    h += `<div class="hint">tick ${T} 末：<b style="color:#fff">${fmt(sim ? sim.fval[n.id] : NaN)}</b></div>`;
  }
  box.innerHTML = h;
  box.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => select({ kind: 'node', id: el.dataset.goto }));
}

function updatePanelErrors() {
  const els = [...document.querySelectorAll('#props [data-ek]')];
  let rtEl = null;
  if (runtimeErr) {
    const mine = els.filter(el => el.dataset.ek.split(':')[0] === runtimeErr.id);
    rtEl = mine.find(el => el.dataset.ek.endsWith(':kind')) || mine.find(el => !el.dataset.ek.endsWith(':name')) || mine[0] || null;
  }
  els.forEach(el => {
    const f = el.dataset.ek.split(':')[1];
    let m = V.err[el.dataset.ek] || '';
    if (!m && el === rtEl) m = '运行时：' + runtimeErr.msg;
    el.textContent = m;
    const inp = el.parentElement.querySelector('input[data-f],input[data-edge],input[data-xfer]');
    if (inp && f !== 'kind' && f !== 'row') inp.classList.toggle('bad', !!m);
  });
}

function renderErrors() {
  const box = $('#errs'), items = [];
  const label = id => {
    const n = nodeById(id); if (n) return `[${TYPES[n.type].label}] ${n.name}`;
    const e = edgeById(id);
    if (e) { const k = V.kind[e.id]; return `[${k === 'in' ? '消耗' : k === 'out' ? '产出' : '连线'}] ${nodeById(e.from)?.name} → ${nodeById(e.to)?.name}`; }
    return id;
  };
  const F = { name: '名称', init: '初始值', cap: '上限', every: '触发间隔', condition: '条件', chance: '概率', times: '执行次数', amount: '数量', kind: '连接', expr: '表达式', row: '绑定行' };
  for (const key in V.err) { const [id, f] = key.split(':'); items.push({ id, text: `${label(id)} ${F[f] || f}：${V.err[key]}` }); }
  if (runtimeErr) items.push({ id: runtimeErr.id, text: `运行时熔断 ${label(runtimeErr.id)}：${runtimeErr.msg}` });
  box.innerHTML = items.map(it => `<div class="eitem" data-id="${esc(it.id)}">${esc(it.text)}</div>`).join('');

/* ================= 画布 ================= */
const cv = $('#cv'), ctx = cv.getContext('2d');
let dpr = 1, raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function resize() {
  const r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
  draw(); drawChart();
}
function toWorld(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left - ui.view.ox) / ui.view.s, y: (ev.clientY - r.top - ui.view.oy) / ui.view.s };
}
const isBox = n => n.type === 'action' && !V.compact.has(n.id);
function hitNode(p) {
  for (let i = G.nodes.length - 1; i >= 0; i--) {
    const n = G.nodes[i];
    if (n.type === 'action') { if (isBox(n) && Math.abs(p.x - n.x) <= AW && Math.abs(p.y - n.y) <= AH) return n; }
    else if ((p.x - n.x) ** 2 + (p.y - n.y) ** 2 <= R * R) return n;
  }
  return null;
}
function boundary(n, ux, uy) {
  if (n.type !== 'action') return R;
  return Math.min(AW / Math.max(1e-6, Math.abs(ux)), AH / Math.max(1e-6, Math.abs(uy)));
}
/** 画布上的可见连线：普通连线 + 折叠成连线的行为 */
function visualLinks() {
  const L = [];
  for (const e of G.edges) {
    const a = nodeById(e.from), b = nodeById(e.to); if (!a || !b) continue;
    const act = ownerAction(e);
    if (act && V.compact.has(act.id)) continue;
    L.push({ kind: 'edge', id: e.id, a, b });
  }
  for (const id of V.compact) {
    const io = V.io[id];
    L.push({ kind: 'compact', id, a: nodeById(io.ins[0].from), b: nodeById(io.outs[0].to) });
  }
  return L;
}
function linkGeom(l, all) {
  const { a, b } = l;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const off = all.some(o => o.a === b && o.b === a) ? 9 : 0, nx = -uy * off, ny = ux * off;
  const ra = boundary(a, ux, uy), rb = boundary(b, ux, uy);
  return { x1: a.x + ux * ra + nx, y1: a.y + uy * ra + ny, x2: b.x - ux * (rb + 3) + nx, y2: b.y - uy * (rb + 3) + ny, ux, uy };
}
function segDist(p, g) {
  const vx = g.x2 - g.x1, vy = g.y2 - g.y1, L2 = vx * vx + vy * vy || 1;
  const t = Math.max(0, Math.min(1, ((p.x - g.x1) * vx + (p.y - g.y1) * vy) / L2));
  return Math.hypot(p.x - (g.x1 + t * vx), p.y - (g.y1 + t * vy));
}
function hitLink(p) {
  const all = visualLinks();
  let best = null, bd = 8 / ui.view.s;
  for (const l of all) { const d = segDist(p, linkGeom(l, all)); if (d < bd) { bd = d; best = l; } }
  return best;
}
function rrect(x, y, w, h, r) {
  ctx.moveTo(x - w + r, y - h); ctx.arcTo(x + w, y - h, x + w, y + h, r); ctx.arcTo(x + w, y + h, x - w, y + h, r);
  ctx.arcTo(x - w, y + h, x - w, y - h, r); ctx.arcTo(x - w, y - h, x + w, y - h, r); ctx.closePath();
}
function shapePath(n) {
  const { x, y } = n; ctx.beginPath();
  if (n.type === 'pool') ctx.arc(x, y, R, 0, Math.PI * 2);
  else if (n.type === 'formula') {
    for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i, px = x + R * Math.cos(a), py = y + R * 0.82 * Math.sin(a); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath();
  } else rrect(x, y, AW, AH, 8);
}
function labelBox(text, x, y, color, bg) {
  ctx.font = '12px Consolas,"Microsoft YaHei",sans-serif';
  const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.rect(x - w / 2, y - 9, w, 18); ctx.fill();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y);
  return w;
}
function arrowHead(g, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(g.x2, g.y2);
  ctx.lineTo(g.x2 - g.ux * 10 - g.uy * 5, g.y2 - g.uy * 10 + g.ux * 5);
  ctx.lineTo(g.x2 - g.ux * 10 + g.uy * 5, g.y2 - g.uy * 10 - g.ux * 5); ctx.closePath(); ctx.fill();
}
function statusDot(x, y, col) {
  if (!col) return;
  ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#14161b'; ctx.stroke();
}
const isBad = id => V.ids.has(id) || (runtimeErr && runtimeErr.id === id);

function render() {
  const W = cv.width / dpr, H = cv.height / dpr, { ox, oy, s } = ui.view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#14161b'; ctx.fillRect(0, 0, W, H);
  const gs = 40 * s;
  if (gs > 8) {
    ctx.fillStyle = '#262a34';
    for (let x = ((ox % gs) + gs) % gs; x < W; x += gs) for (let y = ((oy % gs) + gs) % gs; y < H; y += gs) ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  const hasRun = sim && sim.tick > 0, all = visualLinks();
  for (const l of all) {
    const g = linkGeom(l, all), mx = (g.x1 + g.x2) / 2, my = (g.y1 + g.y2) / 2;
    if (l.kind === 'edge') {
      const e = edgeById(l.id), k = V.kind[e.id], isSel = ui.sel && ui.sel.id === e.id, bad = isBad(e.id);
      const col = bad ? '#ff5d5d' : isSel ? '#ffffff' : k === 'in' ? '#b88484' : k === 'out' ? '#74b38c' : '#7d869c';
      ctx.strokeStyle = col; ctx.lineWidth = isSel ? 2.5 : 1.6;
      ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke(); arrowHead(g, col);
      let txt = k === 'in' || k === 'out' ? trunc(e.amount.trim() || '?', 22) : '';
      if (hasRun && sim.flows[e.id] !== undefined) txt += '  ▸' + fmt(sim.flows[e.id]);
      if (txt) labelBox(txt, mx, my, bad ? '#ff9a9a' : '#e6e9f0', '#1b1e25e6');
    } else {
      const a = nodeById(l.id), io = V.io[a.id], ei = io.ins[0], eo = io.outs[0];
      const isSel = ui.sel && ui.sel.id === a.id, bad = isBad(a.id) || isBad(ei.id) || isBad(eo.id);
      const col = bad ? '#ff5d5d' : isSel ? '#ffffff' : TYPES.action.color;
      ctx.strokeStyle = col; ctx.lineWidth = isSel ? 3 : 2.2;
      ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke(); arrowHead(g, col);
      const ai = ei.amount.trim() || '?', ao = eo.amount.trim() || '?';
      let txt = `${a.name}  ${ai === ao ? ai : ai + '→' + ao}`;
      if (hasRun) { const fi = fmt(sim.flows[ei.id] || 0), fo = fmt(sim.flows[eo.id] || 0); txt += '  ▸' + (fi === fo ? fi : `${fi}→${fo}`); }
      const w = labelBox(trunc(txt, 42), mx, my, bad ? '#ff9a9a' : '#ffe9a8', '#262217ee');
      statusDot(mx - w / 2 - 7, my, statusOf(a));
      const extra = [actionSummary(a), a.condition.trim() ? '当 ' + a.condition.trim() : ''].filter(Boolean).join(' · ');
      ctx.font = '11px Consolas,"Microsoft YaHei",sans-serif'; ctx.fillStyle = '#9a8f6a'; ctx.textAlign = 'center';
      ctx.fillText(trunc(extra, 44), mx, my + 17);
    }
  }
  if (ui.mode === 'link' && ui.linkFrom) {
    const a = nodeById(ui.linkFrom);
    if (a) { ctx.strokeStyle = '#4f8cff'; ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(ui.mouse.x, ui.mouse.y); ctx.stroke(); ctx.setLineDash([]); }
  }
  for (const n of G.nodes) {
    if (n.type === 'action' && !isBox(n)) continue;
    const T = TYPES[n.type], isSel = ui.sel && ui.sel.id === n.id, bad = isBad(n.id);
    shapePath(n);
    ctx.fillStyle = T.color + (n.type === 'action' ? '24' : '2e'); ctx.fill();
    ctx.lineWidth = isSel ? 3 : 2; ctx.strokeStyle = bad ? '#ff5d5d' : isSel ? '#ffffff' : T.color;
    if (ui.linkFrom === n.id) ctx.strokeStyle = '#4f8cff';
    ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (n.type === 'action') {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.fillText(trunc(n.name, 9), n.x, n.y - 7);
      ctx.fillStyle = '#c9bf9a'; ctx.font = '10.5px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.fillText(trunc(actionSummary(n), 18), n.x, n.y + 10);
      if (n.condition.trim()) { ctx.fillStyle = '#b79bdc'; ctx.font = '11px Consolas,"Microsoft YaHei",sans-serif'; ctx.fillText(trunc('当 ' + n.condition.trim(), 28), n.x, n.y + AH + 13); }
      const col = statusOf(n);
      statusDot(n.x + AW - 3, n.y - AH + 3, col);
      const info = sim && sim.act[n.id];
      if (col && info && info.n > 1) { ctx.fillStyle = '#7ee0a0'; ctx.font = 'bold 11px "Segoe UI",sans-serif'; ctx.textAlign = 'left'; ctx.fillText('×' + info.n, n.x + AW + 4, n.y - AH + 3); }
      continue;
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Segoe UI",sans-serif';
    ctx.fillText(trunc(fmt(n.type === 'pool' ? (sim ? sim.val[n.id] : 0) : (sim ? sim.fval[n.id] : NaN)), 9), n.x, n.y);
    ctx.font = '12px "Segoe UI","Microsoft YaHei",sans-serif'; ctx.fillStyle = '#d8dce6';
    ctx.fillText(n.name, n.x, n.y + R + 13);
    let sub = '', subCol = '#8a91a3';
    if (n.type === 'formula') sub = '= ' + String(n.expr || '');
    if (n.type === 'pool' && n.row) { const lbl = rowLabel(n); sub = `⛓ ${rowRefText(n.row)}${lbl ? ' · ' + lbl : ''}`; subCol = '#5fe0c4'; }
    if (sub) { ctx.fillStyle = subCol; ctx.font = '11px Consolas,"Microsoft YaHei",sans-serif'; ctx.fillText(trunc(sub, 26), n.x, n.y + R + 28); }
  }
}

let drag = null;
cv.addEventListener('contextmenu', ev => ev.preventDefault());
cv.addEventListener('mousedown', ev => {
  const p = toWorld(ev);

  if (ev.button !== 0) return startPan();

  const target = n || (l && l.kind === 'compact' ? nodeById(l.id) : null);
  if (m.startsWith('add:')) { if (!n && !l) { addNode(m.slice(4), p); if (!ev.shiftKey) setMode('select'); } return; }
  if (m === 'link') {
    if (target) { if (!ui.linkFrom) ui.linkFrom = target.id; else { const f = ui.linkFrom; ui.linkFrom = null; linkNodes(f, target.id); } }
    else ui.linkFrom = null;

  }
  if (m === 'delete') { if (target) delNode(target.id); else if (l) delEdge(l.id); return; }
  if (n) { if (!ui.sel || ui.sel.id !== n.id) select({ kind: 'node', id: n.id }); drag = { type: 'node', n, dx: p.x - n.x, dy: p.y - n.y }; }
  else if (l) select(l.kind === 'compact' ? { kind: 'node', id: l.id } : { kind: 'edge', id: l.id });
  else { select(null); startPan(); }
});
window.addEventListener('mousemove', ev => {
  if (ui.mode === 'link' && ui.linkFrom) { ui.mouse = toWorld(ev); draw(); }

    let parsed;
    if (wb && sheet) parsed = { ...wbTable(wb, sheet), sheets: wb.SheetNames, sheet, wb };
    else parsed = await fetchParsed(p, sheet);
    const alias = aliasFor(p, parsed.sheet);
    lb.view = { name, path: p, ...parsed, alias, keyField: alias ? tableDef(alias).keyField : guessKey(parsed.cols), sel: null, fromRegistry: false };
    renderPreview(); renderTables();
  } catch (e) {
    $('#lbTitle').textContent = '③ 表预览';
    $('#lbTable').innerHTML = `<div style="padding:8px;color:var(--err)">${esc(e.message)}</div>`;
  }
}
function openRegistered(d, keepSel) {
  const t = TBL[d.alias];
  if (!t || t.status !== 'ok') return toast(t && t.error ? `${d.alias} 加载失败：${t.error}` : `${d.alias} 加载中`, true);
  const sel = keepSel && lb.view && lb.view.alias === d.alias ? lb.view.sel : null;
  lb.view = { name: d.path.split(/[\\/]/).pop() + (d.sheet ? ' / ' + d.sheet : ''), path: d.path, cols: t.cols, rows: t.rows, sheets: null, sheet: d.sheet, alias: d.alias, keyField: d.keyField, sel, fromRegistry: true };
  renderPreview(); renderTables();
}

const MAX_ROWS = 500;
function defaultAlias(name) {
  const base = toIdent(name.replace(/\.[^.]+$/, ''));
  let a = base, i = 2;
  while (checkAlias(a)) { a = base + '_' + i++; if (i > 99) break; }
  return a;
}
function renderPreview() {
  const v = lb.view;
  if (!v) { $('#lbTitle').textContent = '③ 表预览'; $('#lbReg').innerHTML = ''; $('#lbTable').innerHTML = ''; renderBind(); return; }
  $('#lbTitle').textContent = `③ 表预览 · ${v.name}（${v.rows.length} 行${v.rows.length > MAX_ROWS ? '，显示前 ' + MAX_ROWS : ''}）`;
  const sb = $('#lbSheetBar');
  if (v.sheets && v.sheets.length > 1) {
    sb.style.display = '';
    $('#lbSheet').innerHTML = v.sheets.map(n => `<option ${n === v.sheet ? 'selected' : ''}>${esc(n)}</option>`).join('');
  } else sb.style.display = 'none';
  const reg = $('#lbReg');
  if (v.alias) {
    const d = tableDef(v.alias);
    reg.innerHTML = `<span class="dim">已注册为</span><span class="ref">${esc(v.alias)}</span><span class="dim">🔑${esc(v.keyField)}</span>
      <span class="dim" title="可选：画布/图例上在 表[主键] 旁显示的字段，仅用于显示，不影响变量名">🏷显示</span><select id="regLabel" style="max-width:96px"><option value="">（无）</option>${v.cols.map(c => `<option ${d && c === d.labelField ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
    $('#regLabel').onchange = ev => { if (d) { d.labelField = ev.target.value || null; changed(); renderPanel(); renderLegend(); } };
  } else if (!v.cols.length) reg.innerHTML = '<span class="dim">该表没有可识别的字段</span>';
  else {
    reg.innerHTML = `<span class="dim">别名</span><input id="regAlias" style="width:96px" value="${esc(defaultAlias(v.name))}"><span class="dim">主键</span><select id="regKey" style="max-width:100px">${v.cols.map(c => `<option ${c === v.keyField ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select><button class="sm primary" id="regBtn">注册为数据表</button>`;
    $('#regBtn').onclick = registerView;
    $('#regKey').onchange = ev => { v.keyField = ev.target.value; renderPreview(); };
  }
  const ki = v.cols.indexOf(v.keyField);
  let h = '<table><thead><tr><th class="idx">#</th>' + v.cols.map((c, i) => `<th class="${i === ki ? 'key' : ''}" title="${esc(c)}${i === ki ? '（主键）' : ''}">${i === ki ? '🔑' : ''}${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
  const shown = v.rows.slice(0, MAX_ROWS).map((r, ri) => [r, ri]);
  if (v.sel && v.sel.r >= MAX_ROWS && v.rows[v.sel.r]) shown.push([v.rows[v.sel.r], v.sel.r]);
  shown.forEach(([r, ri]) => {
    h += `<tr class="${v.sel && v.sel.r === ri ? 'row-on' : ''}"><td class="idx">${ri + 1}</td>` +
      v.cols.map((c, ci) => `<td data-r="${ri}" data-c="${ci}" class="${v.sel && v.sel.r === ri && v.sel.c === ci ? 'cell-on' : ''}" title="${esc(r[c])}">${esc(r[c])}</td>`).join('') + '</tr>';
  });
  $('#lbTable').innerHTML = h + '</tbody></table>';
  renderBind();
}
$('#lbTable').addEventListener('mousedown', ev => { if (ev.target.closest('td[data-r]')) ev.preventDefault(); });
$('#lbTable').addEventListener('click', ev => {
  const td = ev.target.closest('td[data-r]'); if (!td || !lb.view) return;
  lb.view.sel = { r: +td.dataset.r, c: +td.dataset.c };
  $('#lbTable').querySelectorAll('.cell-on').forEach(x => x.classList.remove('cell-on'));
  $('#lbTable').querySelectorAll('.row-on').forEach(x => x.classList.remove('row-on'));
  td.classList.add('cell-on'); td.parentElement.classList.add('row-on');
  renderBind();
});
$('#lbSheet').addEventListener('change', ev => { const v = lb.view; if (v) openFile(v.path, v.name, ev.target.value, v.wb); });

function renderBind() {
  const box = $('#lbBind'), v = lb.view;
  if (!v) { box.innerHTML = '<span class="dim">打开一个表：注册后可按主键把数据行绑定为货币，或把字段引用插入表达式</span>'; return; }
  if (!v.alias) { box.innerHTML = '<span class="dim">先填写别名、选择主键并注册，之后才能绑定/引用（避免拷贝数值导致与 Luban 脱节）</span>'; return; }
  if (!v.sel) { box.innerHTML = '<span class="dim">点击表中某一行（单元格）开始绑定</span>'; return; }
  const row = v.rows[v.sel.r], field = v.cols[v.sel.c], key = row[v.keyField];
  if (normKey(key) === '') { box.innerHTML = '<span style="color:var(--err)">该行主键为空，无法引用</span>'; return; }
  const rowRef = `${v.alias}[${keyLit(key)}]`;
  const s = ui.sel, pool = s && s.kind === 'node' && nodeById(s.id)?.type === 'pool' ? nodeById(s.id) : null;
  const sameRow = pool && pool.row && pool.row.table === v.alias && normKey(pool.row.key) === normKey(key);
  const fieldRef = sameRow ? `${pool.name}.${field}` : `${rowRef}.${field}`;
  let h = `<span class="ref" title="数据行引用">${esc(rowRef)}</span>`;
  h += `<button class="sm primary" data-b="new" title="新建资源池并绑定到此行">以此行新建货币</button>`;
  if (pool && !sameRow) h += `<button class="sm primary" data-b="bind">绑定到 ${esc(pool.name)}</button>`;
  h += `<button class="sm" data-b="ins" title="插入到最近聚焦的表达式输入框">插入 ${esc(trunc(fieldRef, 26))}</button>`;
  box.innerHTML = h;
  box.querySelectorAll('[data-b]').forEach(b => { b.onmousedown = ev => ev.preventDefault(); });
  box.querySelector('[data-b=new]').onclick = () => newCurrency(v, row, key);
  const bb = box.querySelector('[data-b=bind]');
  if (bb) bb.onclick = () => bindByRef(pool, v.alias, key);
  box.querySelector('[data-b=ins]').onclick = () => insertRef(fieldRef);
}
function newCurrency(v, row, key) {
  const k = keyVal(key);
  const name = uniqueName(rowVarName(v.alias, k), false);
  const initF = v.cols.find(c => /^(init|initial|init_count|init_num|初始值|初始)$/i.test(c));
  const capF = v.cols.find(c => /^(max_stack|max|cap|max_count|limit|上限|堆叠上限)$/i.test(c) && toNum(row[c]) > 0);
  addNode('pool', viewCenter(), { name, row: { table: v.alias, key: k }, init: initF && !Number.isNaN(toNum(row[initF])) ? `${name}.${initF}` : '0', cap: capF ? `${name}.${capF}` : '' });
  toast(`已新建货币 ${name} ⛓ ${v.alias}[${keyLit(k)}]`);
}

/* ================= 顶部按钮 / 快捷键 ================= */
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#btnRun').onclick = () => {
  const n = Math.max(1, Math.min(100000, Math.floor(+$('#ticks').value || 0)));
  $('#ticks').value = n;
  if (V.ids.size) return toast('图中存在错误，请先修正（见右侧「检查」）', true);
  const ms = runSim(n); saveUI();
  if (!runtimeErr) toast(`已运行 ${sim.tick} tick（${ms.toFixed(0)} ms）`);
  else toast('模拟熔断：' + runtimeErr.msg, true);
};
$('#btnStep').onclick = () => { if (!sim) resetSim(); step(); refreshResult(); };
$('#btnReset').onclick = () => { ui.lastRunN = null; saveUI(); resetSim(); refreshResult(); };
$('#autoRerun').onchange = saveUI;
$('#normChk').onchange = () => { saveUI(); drawChart(); };
$('#seed').addEventListener('input', () => { const s = Math.floor(+$('#seed').value); if (Number.isFinite(s)) { G.seed = s; changed(); } });
$('#btnCsv').onclick = exportCsv;
$('#btnExport').onclick = () => download('num-sim-graph.json', JSON.stringify(G, null, 2), 'application/json');
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const g = JSON.parse(await f.text());
    if (!g || !Array.isArray(g.nodes) || !Array.isArray(g.edges)) throw new Error('缺少 nodes / edges');
    loadGraphObj(g, '已导入 ' + f.name, false);
  } catch (e) { toast('导入失败：' + e.message, true); }
};
$('#btnFit').onclick = fitView;
$('#btnExample').onclick = () => { if (confirm('载入示例将覆盖当前图，确定？')) loadGraphObj(exampleGraph(), '已载入示例', true); };
$('#btnClear').onclick = () => { if (confirm('清空当前图（含已注册数据表）？')) loadGraphObj({ version: 3, nextId: 1, nodes: [], edges: [], tables: [] }, '已清空', false); };
$('#lbGo').onclick = () => lbList($('#lbDir').value.trim());
$('#lbDir').addEventListener('keydown', ev => { if (ev.key === 'Enter') lbList($('#lbDir').value.trim()); });
$('#lbUp').onclick = () => { if (lb.parent !== null && lb.parent !== undefined) lbList(lb.parent); };
$('#tblReloadAll').onclick = async () => {
  await reloadTables(); tablesChanged();
  const bad = G.tables.filter(d => TBL[d.alias]?.status !== 'ok');
  toast(bad.length ? `${bad.length} 张表刷新失败` : `已刷新 ${G.tables.length} 张表`, bad.length > 0);
};

window.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (ev.key === 'Delete' || ev.key === 'Backspace') { deleteSelection(); ev.preventDefault(); }
  else if (ev.key === 'Escape') setMode('select');
  else if (ev.key === 'v' || ev.key === 'V') setMode('select');
  else if (ev.key === 'l' || ev.key === 'L') setMode('link');
  else if (ev.key === 'x' || ev.key === 'X') setMode('delete');
});
window.addEventListener('resize', resize);
new ResizeObserver(() => drawChart()).observe(chart);

/* ================= 启动 ================= */
(async function init() {
  try {
    const u = JSON.parse(localStorage.getItem(LS_UI)) || {};
    if (u.ticks) $('#ticks').value = u.ticks;
    if (u.autoRerun === false) $('#autoRerun').checked = false;
    if (u.norm) $('#normChk').checked = true;
  } catch (_) { /* ignore */ }
  $('#seed').value = G.seed;
  if (firstRun) ui.lastRunN = +$('#ticks').value || 200;
  V = validate();
  setMode('select');
  renderPanel(); renderTables(); renderPreview();
  resize();
  if (firstRun || !G.view || bootMigrated) fitView();
  if (bootMigrated) { saveGraph(); toast('已将旧图自动转换为「资源池 + 行为」模型；如需对照示例可点「载入示例」'); }
  resetSim(); refreshResult();
  lbList(localStorage.getItem(LS_DIR) || 'sample');
  await reloadTables();
  V = validate(); renderTables(); renderErrors(); renderPanel();
  if (ui.lastRunN != null && V.ids.size === 0) runSim(ui.lastRunN);
  else { resetSim(); refreshResult(); }
})();
</script>
</body>
</html>
